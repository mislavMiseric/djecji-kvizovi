<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolo sreće 8+</title><style>
:root{font-family:system-ui,Arial;background:#101a33;color:#fff}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:900px;margin:auto}.panel{background:#1b2a4a;border:1px solid #40547c;border-radius:18px;padding:18px;margin:12px 0}h1{text-align:center;color:#ffe177;margin:8px 0 16px}button,input,select{font:inherit;border-radius:9px;padding:10px}button{cursor:pointer;background:#ffd34c;color:#1d2740;border:0;font-weight:700}button:disabled{opacity:.38;cursor:not-allowed}input,select{background:#fff;color:#14203b;border:0;max-width:100%}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.player{padding:10px;border-radius:10px;background:#2b3c61;text-align:center}.active{outline:3px solid #f9d65c}.puzzle{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:18px 0}.tile{display:flex;align-items:center;justify-content:center;width:clamp(24px,5vw,42px);height:48px;border-radius:5px;background:#eaf8ff;color:#102342;font-size:22px;font-weight:900}.space{width:15px}.letters{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.letters button{min-width:37px}.letters button.vowel{background:#a4d8ff}.wheel{width:min(290px,80vw);aspect-ratio:1;border-radius:50%;margin:10px auto;position:relative;border:8px solid #ffe177;background:conic-gradient(#e34b55 0deg 30deg,#308cd6 30deg 60deg,#30ad80 60deg 90deg,#9a66d2 90deg 120deg,#efaa34 120deg 150deg,#2d9dbe 150deg 180deg,#d95f9e 180deg 210deg,#56aa4a 210deg 240deg,#f17d37 240deg 270deg,#6676d9 270deg 300deg,#b63245 300deg 330deg,#687486 330deg 360deg);transition:transform 2.2s cubic-bezier(.13,.75,.22,1)}.wheel:after{content:'★';position:absolute;inset:37%;display:grid;place-items:center;border-radius:50%;background:white;color:#18274c;font-size:35px}.pointer{text-align:center;color:#ffe177;font-size:32px;line-height:1}.center{text-align:center}.hidden{display:none!important}.notice{min-height:28px;color:#ffe177;text-align:center;font-weight:700}.small{font-size:13px;color:#c6d5ef}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.secondary{background:#d2e0f5}#category{color:#ffe177}label{display:block;margin:8px 0}#guess{width:min(320px,100%)}@media(max-width:450px){.tile{height:36px;font-size:17px}.panel{padding:12px}.letters button{min-width:33px;padding:8px}}
</style></head><body><nav id="quiz-hub-return" aria-label="Povratak na izbor igre" style="display:block;position:relative;padding:12px 18px;background:#0b1429;text-align:left;font:700 16px system-ui;z-index:1"><a href="/djecji-kvizovi/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #52617c;border-radius:10px;color:#ffd56a;text-decoration:none">← Sve igre</a></nav><main><h1>🎡 KOLO SREĆE 8+</h1><section class="panel" id="setup"><h2>Postavke igre</h2><label>Broj igrača <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><div id="nameInputs" class="names"></div><div class="center" style="margin-top:18px"><button id="start">ZAPOČNI IGRU</button></div><p class="small">100 različitih pojmova, izmiješanih za svaku novu igru. Zvuk se uključuje nakon prvog klika.</p></section><section id="game" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><b id="round"></b><b id="category"></b><button id="mute" class="secondary">🔊 Zvuk uključen</button></div><div id="players" class="names" style="margin-top:12px"></div></div><div class="panel"><div id="puzzle" class="puzzle"></div><div id="message" class="notice"></div><div class="pointer">▼</div><div class="wheel" id="wheel"></div><div class="center"><h2 id="prize">Zavrti kolo!</h2><button id="spin">🎡 ZAVRTI KOLO</button></div></div><div class="panel"><h3>Suglasnici</h3><div id="consonants" class="letters"></div><h3>Samoglasnici (250 bodova)</h3><div id="vowels" class="letters"></div><div class="center" style="margin-top:18px"><input id="guess" placeholder="Pogodi cijeli pojam"><button id="solve">POTVRDI (+1000)</button></div><div class="controls" style="margin-top:15px"><button id="pass" class="secondary">Preskoči potez</button><button id="next" class="hidden">Sljedeći pojam →</button><button id="restart" class="secondary">Nova igra</button></div></div></section></main><script>
const groups=[['Životinje','SLON','ŽIRAFA','KROKODIL','PINGVIN','LEOPARD','DUPIN','VJEVERICA','KORNJAČA','NOSOROG','HOBOTNICA','KLOKAN','JEŽ','PAPIGA','LISICA','SOVA','MORSKI PAS','POLARNI MEDVJED','DIVLJA SVINJA','CRVENA PANDA','MORSKI KONJIC'],['Sport','NOGOMET','KOŠARKA','ODBOJKA','RUKOMET','TENIS','PLIVANJE','SKIJANJE','BICIKLIZAM','KLIZANJE','GIMNASTIKA','STOLNI TENIS','VATERPOLO','ATLETIKA','KARATE','BADMINTON'],['Vozila','AUTOMOBIL','VATROGASNO VOZILO','AUTOBUS','TRAKTOR','MOTOCIKL','HELIKOPTER','ZRAKOPLOV','PODMORNICA','JEDRILICA','ROMOBIL','TERETNI VLAK','POLICIJSKI AUTO','HITNA POMOĆ','SVEMIRSKI BROD','TRKAĆI AUTOMOBIL'],['Hrana','PALAČINKE','ČOKOLADA','SLADOLED','LUBENICA','JAGODA','ŠPAGETI','KOKICE','KUKURUZ','MANDARINA','PIZZA','KROASAN','POMFRIT','VOĆNA SALATA','ČOKOLADNA TORTA','SENDVIČ'],['Priroda','DUGA','VULKAN','POTRES','SLAP','PUSTINJA','PLANINA','OCEAN','OTOK','ŠUMA','PAHULJICA','GRMLJAVINA','SUNČEVA SVJETLOST','ZVIJEZDA PADALICA','SJEVERNI POL','VODOPAD'],['Zanimanja','VATROGASAC','ASTRONAUT','VETERINAR','KUHAR','POLICAJAC','UČITELJ','DIMNJAČAR','PILOT','ZUBAR','ARHEOLOG','KNJIŽNIČAR','NOGOMETNI SUDAC','POŠTAR','FRIZER','SLASTIČAR'],['Zabava','ŠKOLSKA TORBA','ČAROBNI ŠTAPIĆ','ROĐENDANSKA TORTA','DRUŠTVENA IGRA','TAJNI PROLAZ','BLAGO PIRATA','ZMAJEVO JAJE','DJEČJE IGRALIŠTE','DVORAC OD PIJESKA','VREMENSKI STROJ']];
const bank=groups.flatMap(([cat,...words])=>words.map(word=>({cat,word})));const $=id=>document.getElementById(id);let names=[],scores=[],turn=0,round=0,order=[],seen=new Set(),value=null,solved=false,spinning=false,angle=0,sound=true,ctx=null;const sectors=[100,200,300,400,500,600,700,800,900,1000,'BANKROT','STOP'];const vowels='AEIOU';const alphabet='ABCČĆDĐEFGHIJKLMNOPRSŠTUVZŽ';
function audio(){if(!sound)return null;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function beep(freq=440,duration=.12,type='sine',volume=.11,delay=0){const c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.01)}
function sfx(kind){if(kind==='tick')beep(660,.035,'square',.035);if(kind==='good'){beep(660,.12);beep(880,.18,'sine',.12,.13)}if(kind==='bad'){beep(260,.17,'sawtooth',.06);beep(180,.25,'sawtooth',.05,.17)}if(kind==='bank'){[360,300,240,180].forEach((f,i)=>beep(f,.19,'sawtooth',.08,i*.15))}if(kind==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.21,'triangle',.12,i*.17))}}
function setMessage(s){$('message').textContent=s}function renderNames(){const n=+$('count').value;$('nameInputs').innerHTML='';for(let i=0;i<n;i++){const input=document.createElement('input');input.placeholder='Igrač '+(i+1);input.value='Igrač '+(i+1);input.id='name'+i;$('nameInputs').append(input)}}$('count').onchange=renderNames;renderNames();
function draw(){const item=bank[order[round]];$('round').textContent='Pojam '+(round+1)+' / '+bank.length;$('category').textContent=item.cat;$('players').innerHTML=names.map((n,i)=>`<div class="player ${turn===i?'active':''}"><b>${escapeHtml(n)}</b><div>${scores[i]} bodova</div></div>`).join('');$('puzzle').innerHTML=[...item.word].map(c=>c===' '?'<span class="space"></span>':`<span class="tile">${solved||seen.has(c)?c:'&nbsp;'}</span>`).join('');$('prize').textContent=solved?'RJEŠENO!':value===null?'Zavrti kolo!':value+' bodova po slovu';$('spin').disabled=solved||value!==null||spinning;$('guess').disabled=solved;$('solve').disabled=solved;$('pass').disabled=solved;$('next').classList.toggle('hidden',!solved);for(let [id,chars] of [['consonants',[...alphabet].filter(x=>!vowels.includes(x))],['vowels',[...vowels]]]){$(id).innerHTML='';for(let c of chars){let b=document.createElement('button');b.textContent=c;b.className=vowels.includes(c)?'vowel':'';b.disabled=solved||seen.has(c)||(vowels.includes(c)?scores[turn]<250:value===null)||spinning;b.onclick=()=>choose(c);$(id).append(b)}}}
function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pass(){turn=(turn+1)%names.length;value=null;draw()}
function choose(c){if(solved||seen.has(c)||spinning)return;const vowel=vowels.includes(c);if(vowel&&scores[turn]<250)return;if(!vowel&&value===null)return;seen.add(c);if(vowel)scores[turn]-=250;let n=[...bank[order[round]].word].filter(x=>x===c).length;if(n){if(!vowel)scores[turn]+=n*value;sfx('good');value=null;setMessage('Bravo! Slovo '+c+' pojavljuje se '+n+' puta.');if([...bank[order[round]].word].every(x=>x===' '||seen.has(x)))win()}else{sfx('bad');pass();setMessage('Nema slova '+c+'. Sljedeći igrač!')}draw()}
function win(){solved=true;scores[turn]+=1000;sfx('win');setMessage('Bravo, '+names[turn]+'! Osvojeno je dodatnih 1000 bodova!')}
$('start').onclick=()=>{names=Array.from({length:+$('count').value},(_,i)=>$('name'+i).value.trim()||'Igrač '+(i+1));scores=names.map(()=>0);turn=round=0;order=bank.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}seen=new Set();value=null;solved=false;angle=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');setMessage('Na potezu: '+names[turn]);audio();draw()};
$('spin').onclick=()=>{if(value!==null||solved||spinning)return;spinning=true;let outcome=sectors[Math.floor(Math.random()*sectors.length)];angle+=1440+Math.floor(Math.random()*360);$('wheel').style.transform=`rotate(${angle}deg)`;let ticks=0;const timer=setInterval(()=>{if(++ticks>22){clearInterval(timer);return}sfx('tick')},95);setMessage('Kolo se vrti...');draw();setTimeout(()=>{spinning=false;if(outcome==='BANKROT'){scores[turn]=0;sfx('bank');pass();setMessage('💥 BANKROT! Sljedeći igrač.')}else if(outcome==='STOP'){sfx('bad');pass();setMessage('STOP! Gubiš potez.')}else{value=outcome;sfx('good');setMessage('Odaberi suglasnik za '+outcome+' bodova po pojavljivanju.')}draw()},2300)};
$('solve').onclick=()=>{if(solved)return;let guess=$('guess').value.trim().toLocaleUpperCase('hr-HR').replace(/\s+/g,' ');if(!guess)return;if(guess===bank[order[round]].word){win()}else{sfx('bad');pass();setMessage('Netočno! Sljedeći igrač.')} $('guess').value='';draw()};$('guess').addEventListener('keydown',e=>{if(e.key==='Enter')$('solve').click()});$('pass').onclick=()=>{pass();setMessage('Potez preskočen. Na redu: '+names[turn])};$('next').onclick=()=>{round++;if(round>=bank.length){let max=Math.max(...scores);let winners=names.filter((_,i)=>scores[i]===max);$('game').innerHTML=`<div class="panel center"><h2>🏆 Kraj igre!</h2><h3>Pobjednik: ${winners.map(escapeHtml).join(', ')}</h3><p>${scores.map((s,i)=>escapeHtml(names[i])+': '+s+' bodova').join('<br>')}</p><button onclick="location.reload()">Igraj ponovno</button></div>`;sfx('win');return}seen=new Set();value=null;solved=false;$('guess').value='';setMessage('Nova runda! Na redu: '+names[turn]);draw()};$('restart').onclick=()=>location.reload();$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊 Zvuk uključen':'🔇 Zvuk isključen';if(sound)sfx('good')};
</script></body></html>
